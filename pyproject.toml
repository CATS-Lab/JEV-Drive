[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-drive"
version = "0.1.0"
description = "Structured-state JEV driving experiments with AlpaSim"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "scipy", "shapely>=2", "httpx", "matplotlib", "imageio", "pyarrow", "grpcio", "protobuf"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
jev-drive = "jev_drive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
